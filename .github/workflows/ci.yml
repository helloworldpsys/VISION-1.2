name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.2.0" "python-dotenv==1.0.1" "platformdirs==4.3.6"
      - name: Install package (no heavy runtime deps)
        run: python -m pip install -e . --no-deps
      - name: Run unit tests
        run: python -m pytest -q

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.17.6" "black==26.10.1"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
