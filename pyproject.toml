[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-holographic-assistant"
version = "2.0.0"
description = "Cross-platform voice assistant with a holographic OpenCV interface"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vision contributors" }]
keywords = ["voice-assistant", "ollama", "opencv", "mediapipe", "speech-recognition"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "SpeechRecognition==3.10.4",
    "PyAudio==0.2.14",
    "sounddevice==0.4.7",
    "vosk==0.3.45",
    "opencv-python==4.10.0.84",
    "numpy==1.26.4",
    "mediapipe==0.10.14",
    "edge-tts==6.1.12",
    "certifi==2024.8.30",
    "python-dotenv==1.0.1",
    "platformdirs==4.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov>=5.0,<8",
    "ruff==0.17.6",
    "black==26.10.1",
]
windows = [
    "pycaw>=20240210",
    "comtypes>=1.4.5",
]
# Convenience alias: pip install ".[all]"
all = [
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4.5; sys_platform == 'win32'",
]

[project.scripts]
vision = "vision.app:main"

[project.urls]
Homepage = "https://github.com/helloworldpsys/VISION-1.2"
Issues = "https://github.com/helloworldpsys/VISION-1.2/issues"

[tool.setuptools.packages.find]
include = ["vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["vision"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The UI is a large rendering module; style noise there is not worth churn.
"vision/interface_ui.py" = ["B", "C4", "E", "F841", "N", "RUF", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
  \.venv
| build
| dist
)/
'''
